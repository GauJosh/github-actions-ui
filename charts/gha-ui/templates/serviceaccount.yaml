{{- if .Values.serviceAccount.create }}
# An identity with no permissions: the chart creates no Role, ClusterRole or binding.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gha-ui.serviceAccountName" . }}
  labels:
    {{- include "gha-ui.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
