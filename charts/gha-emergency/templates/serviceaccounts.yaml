# The executor's account: bound to the Role in rbac.yaml (Jobs and their pods and logs, in this namespace only).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gha-emergency.fullname" . }}-executor
  labels:
    {{- include "gha-emergency.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
# The runner's account: no role bindings, and its token is never mounted (job-spec.ts sets
# automountServiceAccountToken: false), so emergency workloads have no Kubernetes API access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gha-emergency.fullname" . }}-runner
  labels:
    {{- include "gha-emergency.labels" . | nindent 4 }}
automountServiceAccountToken: false
