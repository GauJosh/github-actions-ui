apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "gha-emergency.fullname" . }}-data
  labels:
    {{- include "gha-emergency.labels" . | nindent 4 }}
  annotations:
    # Snapshots survive uninstall; delete the claim explicitly to remove them.
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- if not .Values.operatorToken.existingSecret }}
---
# Break-glass credentials (security review H2; formerly the shared operator token): one generated key per account in
# auth.breakGlass.accounts. Generated once and kept across upgrades (lookup), with any key already there (such as the
# old operator token, which grants nothing unless an account of that name is configured), and on uninstall
# (resource-policy keep).
{{- $name := include "gha-emergency.tokenSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if $existing }}{{ $data = deepCopy (default (dict) $existing.data) }}{{ end }}
{{- range (default (list) .Values.auth.breakGlass.accounts) }}
{{- if not (hasKey $data .name) }}{{ $_ := set $data .name (randAlphaNum 48 | b64enc) }}{{ end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "gha-emergency.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v }}
  {{- end }}
{{- end }}
